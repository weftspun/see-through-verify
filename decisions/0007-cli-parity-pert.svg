<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="'SF Mono','Menlo','Monaco',monospace">
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0e0e0"/>
    </marker>
    <marker id="ac-critical" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="1050" fill="url(#bg)"/>
  <text x="600" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">CLI Parity — Critical Path</text>
  <text x="600" y="55" text-anchor="middle" fill="#808080" font-size="12">Lean-Slang pipeline vs weftspun/see-through-cpp</text>

  <!-- Legend -->
  <rect x="30" y="990" width="12" height="12" rx="3" fill="#4caf50"/>
  <text x="48" y="1001" fill="#c0c0c0" font-size="11">Done</text>
  <rect x="120" y="990" width="12" height="12" rx="3" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="2"/>
  <text x="138" y="1001" fill="#c0c0c0" font-size="11">Critical path</text>
  <rect x="270" y="990" width="12" height="12" rx="3" fill="#2d3561" stroke="#5050a0" stroke-width="1.5"/>
  <text x="288" y="1001" fill="#c0c0c0" font-size="11">Pending</text>
  <rect x="380" y="990" width="12" height="12" rx="3" fill="#3a3a1a" stroke="#a0a050" stroke-width="1.5"/>
  <text x="398" y="1001" fill="#c0c0c0" font-size="11">Optional</text>
  <text x="750" y="1001" fill="#606060" font-size="10">Baseline: see-through-cpp at 74s/step (M2 Pro) · 5s/step (RTX 4090)</text>

  <!-- ===== ROW 1: Foundation ===== -->

  <!-- Node 1: GEMM shader -->
  <rect x="40" y="90" width="160" height="55" rx="8" fill="#1a3a1a" stroke="#4caf50" stroke-width="2"/>
  <text x="120" y="112" text-anchor="middle" fill="#8bc34a" font-size="11" font-weight="bold">GEMM shader</text>
  <text x="120" y="127" text-anchor="middle" fill="#a0a0a0" font-size="9">Tiled half-tile groupshared</text>
  <text x="120" y="139" text-anchor="middle" fill="#66bb6a" font-size="9">Slang → Metal → .metallib ✓</text>

  <!-- Node 2: Vulkan dispatch -->
  <rect x="230" y="90" width="160" height="55" rx="8" fill="#1a3a1a" stroke="#4caf50" stroke-width="2"/>
  <text x="310" y="112" text-anchor="middle" fill="#8bc34a" font-size="11" font-weight="bold">Vulkan compute</text>
  <text x="310" y="127" text-anchor="middle" fill="#a0a0a0" font-size="9">MoltenVK portability</text>
  <text x="310" y="139" text-anchor="middle" fill="#66bb6a" font-size="9">max_err=0.0 ✓</text>

  <!-- Node 3: Weight loader -->
  <rect x="420" y="90" width="160" height="55" rx="8" fill="#1a3a1a" stroke="#4caf50" stroke-width="2"/>
  <text x="500" y="112" text-anchor="middle" fill="#8bc34a" font-size="11" font-weight="bold">Weight loader</text>
  <text x="500" y="127" text-anchor="middle" fill="#a0a0a0" font-size="9">Safetensors → BF16</text>
  <text x="500" y="139" text-anchor="middle" fill="#66bb6a" font-size="9">5779 tensors across 8 models ✓</text>

  <!-- Node 4: CLI interface -->
  <rect x="610" y="90" width="160" height="55" rx="8" fill="#1a3a1a" stroke="#4caf50" stroke-width="2"/>
  <text x="690" y="112" text-anchor="middle" fill="#8bc34a" font-size="11" font-weight="bold">CLI interface</text>
  <text x="690" y="127" text-anchor="middle" fill="#a0a0a0" font-size="9">flag parsing + --demo</text>
  <text x="690" y="139" text-anchor="middle" fill="#66bb6a" font-size="9">see-through.cpp ✓</text>

  <!-- Foundation milestone -->
  <rect x="820" y="98" width="140" height="44" rx="22" fill="#1a3a1a" stroke="#4caf50" stroke-width="2"/>
  <text x="890" y="118" text-anchor="middle" fill="#8bc34a" font-size="11" font-weight="bold">FOUNDATION</text>
  <text x="890" y="132" text-anchor="middle" fill="#66bb6a" font-size="9">4/4 complete</text>
  <line x1="770" y1="117" x2="820" y2="117" stroke="#4caf50" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- ===== ROW 2: Shader coverage (parallel) ===== -->

  <!-- Node A: CLIP encoder -->
  <rect x="40" y="200" width="220" height="70" rx="8" fill="#2d3561" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="150" y="222" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">A · CLIP text encoder</text>
  <text x="150" y="238" text-anchor="middle" fill="#d0d0d0" font-size="10">Transformer: 12× GEMM + attn + norm</text>
  <text x="150" y="253" text-anchor="middle" fill="#a0a0a0" font-size="10">Weights: 2 files, 1.5GB</text>

  <!-- Node B: UNet body -->
  <rect x="290" y="200" width="220" height="70" rx="8" fill="#2d3561" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="400" y="222" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">B · LayerDiff UNet body</text>
  <text x="400" y="238" text-anchor="middle" fill="#d0d0d0" font-size="10">3-level UNet + transformer blocks</text>
  <text x="400" y="253" text-anchor="middle" fill="#a0a0a0" font-size="10">2452 weight tensors, 7.6GB</text>

  <!-- Node C: Marigold depth -->
  <rect x="540" y="200" width="220" height="70" rx="8" fill="#2d3561" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="650" y="222" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">C · Marigold depth UNet</text>
  <text x="650" y="238" text-anchor="middle" fill="#d0d0d0" font-size="10">2-level depth estimation</text>
  <text x="650" y="253" text-anchor="middle" fill="#a0a0a0" font-size="10">990 weight tensors, 2.3GB</text>

  <!-- Node D: VAE decode -->
  <rect x="790" y="200" width="220" height="70" rx="8" fill="#2d3561" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="900" y="222" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">D · VAE decoder</text>
  <text x="900" y="238" text-anchor="middle" fill="#d0d0d0" font-size="10">3 decoders: trans-vae, sd-vae, marigold-vae</text>
  <text x="900" y="253" text-anchor="middle" fill="#a0a0a0" font-size="10">1052 total weight tensors</text>

  <!-- Foundation → Row 2 -->
  <line x1="150" y1="145" x2="150" y2="200" stroke="#ff6b6b" stroke-width="2" marker-end="url(#ac-critical)" opacity="0.5"/>

  <!-- ===== ROW 3: Critical path ===== -->

  <!-- Node E: Shader dispatch runner -->
  <rect x="40" y="320" width="260" height="65" rx="8" fill="#4a1a1a" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="170" y="342" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">E · Dispatch runner</text>
  <text x="170" y="358" text-anchor="middle" fill="#d0d0d0" font-size="10">Read model graph → sequence shader dispatches</text>
  <text x="170" y="373" text-anchor="middle" fill="#a0a0a0" font-size="10">GEMM + attn + norm + activation per layer</text>

  <!-- Node F: Diffusion scheduler -->
  <rect x="340" y="320" width="260" height="65" rx="8" fill="#4a1a1a" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="470" y="342" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">F · Diffusion scheduler</text>
  <text x="470" y="358" text-anchor="middle" fill="#d0d0d0" font-size="10">DDIM: timestep loop + noise schedule</text>
  <text x="470" y="373" text-anchor="middle" fill="#a0a0a0" font-size="10">30 steps × 2 UNet passes (body + head)</text>

  <!-- Node G: Layer postprocess -->
  <rect x="640" y="320" width="260" height="65" rx="8" fill="#4a1a1a" stroke="#ff6b6b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="770" y="342" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">G · Layer postprocess</text>
  <text x="770" y="358" text-anchor="middle" fill="#d0d0d0" font-size="10">Depth reordering → bbox → PSD assembly</text>
  <text x="770" y="373" text-anchor="middle" fill="#a0a0a0" font-size="10">16 layers at 768×768</text>

  <!-- Row 2 → E -->
  <line x1="150" y1="270" x2="150" y2="320" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>
  <line x1="400" y1="270" x2="400" y2="320" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>
  <line x1="650" y1="270" x2="650" y2="320" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>
  <line x1="900" y1="270" x2="900" y2="320" stroke="#a0a0a0" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#ac)"/>

  <!-- E → F → G -->
  <line x1="300" y1="352" x2="340" y2="352" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>
  <line x1="600" y1="352" x2="640" y2="352" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>

  <!-- ===== ROW 4: PSD + CLI ===== -->

  <!-- Node H: PSD output -->
  <rect x="250" y="440" width="260" height="55" rx="8" fill="#3a3a1a" stroke="#a0a050" stroke-width="1.5"/>
  <text x="380" y="462" text-anchor="middle" fill="#d0d0d0" font-size="12" font-weight="bold">H · PSD writer</text>
  <text x="380" y="478" text-anchor="middle" fill="#a0a0a0" font-size="10">Reuse psd_sdk from see-through-cpp</text>

  <!-- Node I: CLI flags -->
  <rect x="550" y="440" width="260" height="55" rx="8" fill="#3a3a1a" stroke="#a0a050" stroke-width="1.5"/>
  <text x="680" y="462" text-anchor="middle" fill="#d0d0d0" font-size="12" font-weight="bold">I · Full CLI flags</text>
  <text x="680" y="478" text-anchor="middle" fill="#a0a0a0" font-size="10">50+ args: --steps, --res, --split-depth, --device</text>

  <!-- G → H, G → I -->
  <line x1="770" y1="385" x2="510" y2="440" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>
  <line x1="770" y1="385" x2="680" y2="440" stroke="#a0a0a0" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#ac)"/>

  <!-- ===== MILESTONE ===== -->

  <!-- Milestone CLIP only -->
  <rect x="80" y="520" width="220" height="50" rx="25" fill="#2d3561" stroke="#ff6b6b" stroke-width="2"/>
  <text x="190" y="542" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">M1 · CLIP encode only</text>
  <text x="190" y="557" text-anchor="middle" fill="#d0d0d0" font-size="9">GEMM + attn validation</text>
  <line x1="300" y1="385" x2="190" y2="520" stroke="#a0a0a0" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#ac)"/>

  <!-- Milestone UNet single step -->
  <rect x="350" y="520" width="220" height="50" rx="25" fill="#4a1a1a" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="460" y="542" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">M2 · UNet step</text>
  <text x="460" y="557" text-anchor="middle" fill="#d0d0d0" font-size="9">One diffusion step on GPU</text>
  <line x1="470" y1="385" x2="460" y2="520" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>

  <!-- Final milestone -->
  <rect x="620" y="520" width="240" height="50" rx="25" fill="#4a1a1a" stroke="#ff6b6b" stroke-width="3"/>
  <text x="740" y="542" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">CLI PARITY</text>
  <text x="740" y="557" text-anchor="middle" fill="#d0d0d0" font-size="9">Full pipeline, matching reference PSD</text>
  <line x1="570" y1="467" x2="740" y2="520" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ac-critical)"/>

  <!-- Critical path description -->
  <text x="50" y="620" fill="#808080" font-size="11" font-weight="bold">Critical path (red border):</text>
  <text x="50" y="640" fill="#a0a0a0" font-size="10">A → E → F → G → H  (CLIP → runner → scheduler → postprocess → PSD)</text>
  <text x="50" y="660" fill="#a0a0a0" font-size="10">Each model's layers are a sequence of GEMM + attn + norm dispatches.</text>
  <text x="50" y="680" fill="#a0a0a0" font-size="10">The dispatch runner reads weight bindings from Compute/Model.lean descriptors.</text>
  <text x="50" y="700" fill="#808080" font-size="11" font-weight="bold">Shortest path to value:</text>
  <text x="50" y="720" fill="#a0a0a0" font-size="10">1. Wire CLIP encoder (12 transformer blocks) — validates GEMM + attn + norm chain</text>
  <text x="50" y="738" fill="#a0a0a0" font-size="10">2. Wire one UNet step (resnet + transformer blocks) — validates conv2d + attention</text>
  <text x="50" y="756" fill="#a0a0a0" font-size="10">3. Add DDIM scheduler (30-step loop + noise schedule)</text>
  <text x="50" y="774" fill="#a0a0a0" font-size="10">4. Wire Marigold + VAE decode + postprocess → PSD output</text>

  <!-- Status bar -->
  <rect x="50" y="800" width="1100" height="30" rx="4" fill="#2d3561"/>
  <text x="60" y="820" fill="#e0e0e0" font-size="11">Models:</text>
  <rect x="140" y="807" width="100" height="16" rx="3" fill="#1a3a1a" stroke="#4caf50" stroke-width="1"/>
  <text x="190" y="820" text-anchor="middle" fill="#8bc34a" font-size="9">GEMM ✓</text>
  <rect x="250" y="807" width="100" height="16" rx="3" fill="#1a3a1a" stroke="#4caf50" stroke-width="1"/>
  <text x="300" y="820" text-anchor="middle" fill="#8bc34a" font-size="9">CLIP 🟡</text>
  <rect x="360" y="807" width="100" height="16" rx="3" fill="#2d3561" stroke="#5050a0" stroke-width="1"/>
  <text x="410" y="820" text-anchor="middle" fill="#c0c0c0" font-size="9">UNet 🔴</text>
  <rect x="470" y="807" width="100" height="16" rx="3" fill="#2d3561" stroke="#5050a0" stroke-width="1"/>
  <text x="520" y="820" text-anchor="middle" fill="#c0c0c0" font-size="9">Depth 🔴</text>
  <rect x="580" y="807" width="100" height="16" rx="3" fill="#2d3561" stroke="#5050a0" stroke-width="1"/>
  <text x="630" y="820" text-anchor="middle" fill="#c0c0c0" font-size="9">VAE 🔴</text>
  <rect x="690" y="807" width="100" height="16" rx="3" fill="#2d3561" stroke="#5050a0" stroke-width="1"/>
  <text x="740" y="820" text-anchor="middle" fill="#c0c0c0" font-size="9">Post 🔴</text>
</svg>